[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bonds-engine"
version = "4.0.0"
description = "Fixed Income Analytics Engine: bond parsing, scoring, ML, desk tools for MOEX markets"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "LicenseRef-Proprietary" }
keywords = ["bonds", "stocks", "fixed-income", "equities", "moex", "scraper", "analytics"]

dependencies = [
    "playwright>=1.49.0",
    "playwright-stealth>=1.0.6",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    "redis[hiredis]>=5.2.0",
    "apscheduler>=3.10.4",
    "tenacity>=9.0.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    "loguru>=0.7.2",
    "python-dotenv>=1.0.1",
    "tqdm>=4.67.0",
    "aiogram>=3.13.0",
    "matplotlib>=3.9.0",
    "numpy>=2.1.0",
    "scipy>=1.14.0",
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
    "fastapi>=0.115.0",
    "python-multipart>=0.0.6",
    "uvicorn[standard]>=0.32.0",
    "aiohttp>=3.10.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.27.0",
    "jinja2>=3.1.0",
    "aiofiles>=24.1.0",
    "prometheus-client>=0.21.0",
    "yookassa>=3.4.1",
    "openpyxl>=3.1.2",
    "email-validator>=2.2.0",
]

[project.optional-dependencies]
prod = [
    "sentry-sdk>=2.18.0",
    "gunicorn>=23.0.0",
]
load = [
    "locust>=2.32.0",
]
dev = [
    "mypy>=1.15",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8,<0.17",
    "httpx>=0.27.0",
]

[project.scripts]
bonds-engine = "scraper.__main__:main"
bonds-bot = "telegram_bot.bot:cli"
bonds-api = "api.main:run"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "scraper*", "scraper/sources*", "scraper/sources/aigenis*",
    "desk*", "forecast*", "ml*", "monitoring*",
    "notifications*", "portfolio*", "recommendations*",
    "scoring*", "telegram_bot*", "visualization*", "api*",
    "api/auth*", "api/billing*", "api/admin*",
    "api/admin/templates/*",
]
exclude = ["alembic*"]

[tool.ruff]
line-length = 100
# Keep lint/format output stable across the supported Python 3.13+ runtimes.
# The production image and CI target 3.13; py314 formatter output is not yet
# stable in the Ruff versions used by the development environment.
target-version = "py313"
# Alembic migrations are (partly) auto-generated; don't gate CI on their style.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "ASYNC", "SIM", "ARG", "C4", "RUF", "C901"]
# E501 (long lines) and RUF012 (mutable default in dataclass) are intentionally allowed.
# RUF001/002/003 fire on the project's intentional Russian (Cyrillic) UI strings.
# B008 (Depends(...) in FastAPI route signatures) is idiomatic and unavoidable.
ignore = ["E501", "RUF012", "RUF001", "RUF002", "RUF003", "B008"]

[tool.ruff.lint.mccabe]
# Complexity budget (A-12): functions must stay <= 12 branches. The legacy
# files listed in per-file-ignores carry a C901 baseline and are refactor
# targets; the limit applies to all new code.
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
# scikit-learn convention: `X` holds the feature matrix.
"ml/**" = ["N806"]
# pytest fixtures are passed as test-function arguments but never referenced directly;
# mock callables in tests commonly have unused/unpacked parameters by design.
"tests/**" = ["ARG001", "ARG002", "ARG005", "RUF059"]
# Stub endpoints for the Aigenis integration contract: parameters are part of the
# OpenAPI contract and will be used once the real data feed is connected.
"api/aigenis/__init__.py" = ["ARG001"]
# Legacy C901 baseline (see scripts/check_size_budget.py): these modules
# predate the complexity budget and are scheduled for refactoring.
"api/billing/service.py" = ["C901"]
"api/notifications/reminders.py" = ["C901"]
"api/seo/calculator.py" = ["C901"]
"api/seo/pages.py" = ["C901"]
"ml/features.py" = ["C901"]
"monitoring/engine.py" = ["C901"]
"portfolio/backtest.py" = ["C901"]
"portfolio/pnl.py" = ["C901"]
"recommendations/engine.py" = ["C901"]
"scoring/data_quality.py" = ["C901"]
"scoring/engine.py" = ["C901"]
"scraper/__main__.py" = ["C901"]
"scraper/fallback_source.py" = ["C901"]
"scraper/parsers/xlsx.py" = ["C901"]
"scraper/pipeline.py" = ["C901"]
"scraper/scheduler.py" = ["C901"]
"scraper/sources/aigenis/client.py" = ["C901"]
"scraper/sources/aigenis/parsers/detail.py" = ["C901"]
"scraper/sources/aigenis/parsers/listing.py" = ["C901"]
"telegram_bot/bond_picker.py" = ["C901"]

fixable = ["I", "UP", "W"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = false
ignore_missing_imports = true
files = [
    "scraper", "desk", "forecast", "ml", "monitoring",
    "notifications", "portfolio", "recommendations",
    "scoring", "telegram_bot", "visualization", "api",
]

[[tool.mypy.overrides]]
module = "scraper.models"
strict = true

[[tool.mypy.overrides]]
module = "scraper.repositories.*"
strict = true

[[tool.mypy.overrides]]
module = "scraper.config"
strict = true

# Phase 0, item 0.5: core packages must pass mypy strict before merge.
[[tool.mypy.overrides]]
module = ["api.aigenis", "scoring", "portfolio"]
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
markers = [
    "load: server load / stress tests (require a running API + locust)",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
