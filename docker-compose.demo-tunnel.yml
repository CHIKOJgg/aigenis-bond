# Optional public tunnel for the standalone fixtures-only demo.
# Configure a Cloudflare Tunnel token in the environment; never commit it.
services:
  cloudflared-demo:
    image: cloudflare/cloudflared:latest
    container_name: aigenis-demo-cloudflared
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TUNNEL_TOKEN:?Set CLOUDFLARED_TUNNEL_TOKEN}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TUNNEL_ORIGIN_REQUEST_NO_TLS_VERIFY: "true"
    # The published hostname in Cloudflare should target:
    #   http://host.docker.internal:8080
