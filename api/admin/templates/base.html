<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aigenis Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f5f9fb] text-[#01121a] min-h-screen">
  <nav class="border-b border-[#d6e2e6] bg-white px-6 py-3 flex items-center justify-between">
    <div class="flex items-center gap-4">
      <a href="/admin" class="text-lg font-bold text-[#004b65]">Aigenis Admin</a>
      <a href="/admin/users" class="text-sm text-[#516c79] hover:text-[#01121a]">Users</a>
    </div>
    <div class="flex items-center gap-3">
      <span class="text-sm text-[#516c79]">{{ admin.name }}</span>
      <span class="text-xs bg-[#eef3f5] text-[#004b65] border border-[#b2c9d1] px-2 py-0.5 rounded">{{ admin.subscription_tier }}</span>
      <a href="/admin/login" class="text-sm text-[#b91c1c] hover:text-[#8f3434]">Logout</a>
    </div>
  </nav>
  <main class="max-w-7xl mx-auto p-6">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
