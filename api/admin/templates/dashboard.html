{% extends "base.html" %}
{% block content %}
<div class="space-y-6">
  <h2 class="text-2xl font-bold">Dashboard</h2>
  <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
    <div class="bg-white rounded-xl border border-[#d6e2e6] p-4">
      <p class="text-sm text-[#516c79]">Total Users</p>
      <p class="text-2xl font-bold text-[#004b65]">{{ total_users }}</p>
    </div>
    <div class="bg-white rounded-xl border border-[#d6e2e6] p-4">
      <p class="text-sm text-[#516c79]">Active Users</p>
      <p class="text-2xl font-bold text-[#387387]">{{ active_users }}</p>
    </div>
    <div class="bg-white rounded-xl border border-[#d6e2e6] p-4">
      <p class="text-sm text-[#516c79]">By Tier</p>
      <div class="mt-2 space-y-1">
        {% for tier, count in by_tier.items() %}
          <div class="flex justify-between text-sm">
            <span class="text-[#516c79] capitalize">{{ tier }}</span>
            <span class="font-mono">{{ count }}</span>
          </div>
        {% endfor %}
      </div>
    </div>
  </div>
</div>
{% endblock %}
