# =============================================================================
# Aigenis Analytics Integration — Docker Compose (B2B Profile)
# =============================================================================
# Отдельный профиль для поставки аналитического модуля в терминал Aigenis.
# НЕ содержит: Telegram-бот, YooKassa, email-auth, SEO-лендинг, рефералы.
#
# Быстрый старт:
#   cp .env.aigenis.example .env.aigenis
#   docker compose -f docker-compose.aigenis.yml up -d
#
# Состав:
#   api              — FastAPI (аналитические эндпоинты /api/aigenis/v1/*)
#   parser           — сбор данных + планировщик (MarketDataProvider)
#   postgres         — основная БД аналитики
#   redis            — кэш, rate limiting, locks
#   frontend         — nginx + React SPA (аналитический UI / demo-shell)
#   prometheus       — сбор метрик
#   grafana          — дашборды observability
# =============================================================================

services:
  # --------------------------------------------------------------------------
  # PostgreSQL 16
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: aigenis-analytics-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aigenis_analytics}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      POSTGRES_DB: ${POSTGRES_DB:-aigenis_analytics}
    ports:
      - "${POSTGRES_PORT:-127.0.0.1:5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aigenis_analytics} -d ${POSTGRES_DB:-aigenis_analytics}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - aigenis-net
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEM_LIMIT:-512M}
        reservations:
          memory: ${POSTGRES_MEM_RESERVE:-256M}

  # --------------------------------------------------------------------------
  # Redis 7 (with password)
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: aigenis-analytics-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --appendonly yes
      --maxmemory ${REDIS_MAX_MEMORY:-256mb}
      --maxmemory-policy ${REDIS_MAXMEM_POLICY:-allkeys-lru}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aigenis-net
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEM_LIMIT:-256M}
        reservations:
          memory: ${REDIS_MEM_RESERVE:-128M}

  # --------------------------------------------------------------------------
  # Parser (сбор данных + планировщик)
  # Использует MarketDataProvider — конфигурируемый источник данных.
  # В production запрещён browser scraping (AIGENIS_HEADLESS=false по умолчанию).
  # --------------------------------------------------------------------------
  parser:
    build:
      context: .
      dockerfile: Dockerfile
    image: aigenis-analytics:latest
    container_name: aigenis-analytics-parser
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # --- Deployment ---
      DEPLOYMENT_PROFILE: aigenis
      AIGENIS_ENVIRONMENT: ${AIGENIS_ENVIRONMENT:-production}
      DEMO_MODE: ${DEMO_MODE:-0}
      # --- Data Provider ---
      DATA_PROVIDER: ${DATA_PROVIDER:-aigenis_official}
      DATA_PROVIDER_API_URL: ${DATA_PROVIDER_API_URL:-}
      DATA_PROVIDER_API_KEY: ${DATA_PROVIDER_API_KEY:-}
      # --- Browser scraping запрещён на production ---
      AIGENIS_HEADLESS: "false"
      AIGENIS_USE_STEALTH: "false"
      # --- Logging ---
      AIGENIS_LOG_LEVEL: ${AIGENIS_LOG_LEVEL:-INFO}
      AIGENIS_LOG_JSON: ${AIGENIS_LOG_JSON:-true}
      AIGENIS_LOG_FILE: /app/logs/scraper.log
      # --- Sentry ---
      SENTRY_DSN: ${SENTRY_DSN:-}
      # --- Database ---
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-aigenis_analytics}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aigenis_analytics}}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC:-postgresql://${POSTGRES_USER:-aigenis_analytics}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aigenis_analytics}}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_POOL_OVERFLOW: ${DB_POOL_OVERFLOW:-20}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30.0}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-3600}
      # --- Redis ---
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD}@redis:6379/0}
      REDIS_MAX_CONNECTIONS: ${REDIS_MAX_CONNECTIONS:-20}
    volumes:
      - logs:/app/logs
      - ml_artifacts:/app/ml/artifacts
    networks:
      - aigenis-net
    deploy:
      resources:
        limits:
          memory: ${PARSER_MEM_LIMIT:-2G}
        reservations:
          memory: ${PARSER_MEM_RESERVE:-1G}

  # --------------------------------------------------------------------------
  # REST API — аналитические эндпоинты
  # Слушает /api/aigenis/v1/* — контракт поставки для Aigenis.
  # НЕ содержит: /auth/*, /billing/*, публичную регистрацию.
  # --------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: aigenis-analytics:latest
    container_name: aigenis-analytics-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      DEPLOYMENT_PROFILE: aigenis
      AIGENIS_ENVIRONMENT: ${AIGENIS_ENVIRONMENT:-production}
      DEMO_MODE: ${DEMO_MODE:-0}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-aigenis_analytics}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aigenis_analytics}}
      AIGENIS_LOG_LEVEL: ${AIGENIS_LOG_LEVEL:-INFO}
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD}@redis:6379/0}
      RATE_LIMIT_BACKEND: ${RATE_LIMIT_BACKEND:-memory}
      TRUSTED_PROXY: ${TRUSTED_PROXY:-1}
      # --- Aigenis SSO / Gateway ---
      AIGENIS_SSO_JWKS_URL: ${AIGENIS_SSO_JWKS_URL:-}
      AIGENIS_SSO_ISSUER: ${AIGENIS_SSO_ISSUER:-aigenis}
      AIGENIS_SSO_AUDIENCE: ${AIGENIS_SSO_AUDIENCE:-analytics-module}
      # --- CORS: только origin терминала Aigenis ---
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # --- Frontend ---
      FRONTEND_DIR: /app/frontend/dist
    volumes:
      - logs:/app/logs
      - ml_artifacts:/app/ml/artifacts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - aigenis-net
    command:
      - python
      - -m
      - uvicorn
      - api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "2"
      - --log-level
      - info
    deploy:
      resources:
        limits:
          memory: ${API_MEM_LIMIT:-512M}
        reservations:
          memory: ${API_MEM_RESERVE:-256M}

  # --------------------------------------------------------------------------
  # Frontend (nginx) — аналитический UI + API proxy
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: aigenis-analytics-ui:latest
    container_name: aigenis-analytics-frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/nginx.aigenis.conf:/etc/nginx/nginx.conf:ro
    networks:
      - aigenis-net
    deploy:
      resources:
        limits:
          memory: ${FRONTEND_MEM_LIMIT:-128M}
        reservations:
          memory: ${FRONTEND_MEM_RESERVE:-64M}

  # --------------------------------------------------------------------------
  # Prometheus — сбор метрик
  # --------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: aigenis-analytics-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - aigenis-net
    deploy:
      resources:
        limits:
          memory: ${PROMETHEUS_MEM_LIMIT:-512M}
        reservations:
          memory: ${PROMETHEUS_MEM_RESERVE:-256M}

  # --------------------------------------------------------------------------
  # Grafana — дашборды observability
  # --------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: aigenis-analytics-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
    networks:
      - aigenis-net
    deploy:
      resources:
        limits:
          memory: ${GRAFANA_MEM_LIMIT:-256M}
        reservations:
          memory: ${GRAFANA_MEM_RESERVE:-128M}

networks:
  aigenis-net:
    name: aigenis-analytics-net
    driver: bridge

volumes:
  pgdata:
    name: aigenis-analytics-pgdata
  redisdata:
    name: aigenis-analytics-redisdata
  logs:
    name: aigenis-analytics-logs
  ml_artifacts:
    name: aigenis-analytics-ml-artifacts
  prometheus-data:
    name: aigenis-analytics-prometheus-data
  grafana-data:
    name: aigenis-analytics-grafana-data
