# Aigenis Frontend — shared nginx locations (API proxy + widget + static)
# Included by both the HTTP (port 80) and HTTPS (port 443) server blocks.

# API proxy
location /api/ {
    limit_req zone=api burst=200 nodelay;
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}

# Auth endpoints
location /auth/ {
    limit_req zone=auth burst=20 nodelay;
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
}

# Billing endpoints
location /billing/ {
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
}

# Admin panel
location /admin/ {
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
}

# Telegram bot webhook — proxied to the bot container's webhook server
# (telegram_bot/bot.py, WEBHOOK_PORT=8080), NOT to the API. Telegram posts to
# <WEBHOOK_URL><WEBHOOK_PATH> where WEBHOOK_PATH defaults to /webhook.
# The exact location matches WEBHOOK_PATH=/webhook; the prefix covers custom paths.
location = /webhook {
    proxy_pass http://bot_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

location /webhook/ {
    proxy_pass http://bot_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

# Public widget: JSON payload + embed script are served by the API.
# ^~ skips regex locations, so /widget/embed.js is NOT treated as a
# static asset (which would 404 via try_files).
location ^~ /widget/ {
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
}

# Widget iframe page is meant to be embedded on partner sites: allow
# framing from any origin (override the global frame-ancestors 'none').
location = /widget {
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors *;";
    add_header X-Frame-Options "";
    add_header X-Content-Type-Options "nosniff";
    try_files /index.html =404;
}

# Health check
location /health {
    proxy_pass http://api_backend/health;
    access_log off;
}

# Static assets with caching
location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}
