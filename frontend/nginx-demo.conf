# =============================================================================
# Aigenis Frontend — DEMO nginx configuration (live read-only)
# =============================================================================
# Standalone demo deployment: serves the static SPA build and proxies only the
# read-only /api/v1/demo family. NO payments, NO Telegram, NO write endpoints.
# robots.txt returns Disallow: / and every
# response carries X-Robots-Tag: noindex, nofollow so the demo never appears
# in search engines.
#
# Usage: docker compose -f docker-compose.demo.yml up -d
# =============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # Re-resolve the upstream on every reload window so restarting the API
    # container (new IP) does not permanently 502 the proxy until nginx itself
    # is restarted. 127.0.0.11 is the Docker embedded DNS.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript image/svg+xml;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Demo must never be indexed: noindex header on every response.
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;

        # robots.txt: block crawling entirely, no sitemap.
        location = /robots.txt {
            add_header Content-Type text/plain;
            add_header X-Robots-Tag "noindex, nofollow" always;
            return 200 "User-agent: *\nDisallow: /\n";
        }

        # Sitemap is not generated for the demo; return 404 for known paths.
        location = /sitemap.xml {
            add_header X-Robots-Tag "noindex, nofollow" always;
            return 404;
        }

        # Health check for uptime monitoring (6.10).
        location = /health {
            default_type application/json;
            add_header X-Robots-Tag "noindex, nofollow" always;
            return 200 '{"status":"ok"}';
        }

        # Read-only live demo API family: market snapshot, bond search, single
        # bond detail (analytics + history + coupon calendar). The API is on
        # the internal Docker network; every other /api family fails closed
        # below.
        location ^~ /api/v1/demo/ {
            set $demo_api http://api:8000;
            proxy_pass $demo_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
        }

        # The demo must not masquerade as the full product. These routes have
        # no upstream in this image and deliberately fail closed instead of
        # falling back to the SPA shell.
        location ~ ^/(api|auth|billing|admin|webhook)(/|$) {
            add_header X-Robots-Tag "noindex, nofollow" always;
            return 404;
        }

        # Static assets with caching
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
