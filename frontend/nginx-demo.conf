# =============================================================================
# Aigenis Frontend — DEMO nginx configuration (fixtures-only)
# =============================================================================
# Standalone demo deployment: serves the static SPA build, NO API proxy,
# NO payments, NO Telegram, NO bot. robots.txt returns Disallow: / and every
# response carries X-Robots-Tag: noindex, nofollow so the demo never appears
# in search engines.
#
# Usage: docker compose -f docker-compose.demo.yml up -d
# =============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript image/svg+xml;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Demo must never be indexed: noindex header on every response.
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;

        # robots.txt: block crawling entirely, no sitemap.
        location = /robots.txt {
            add_header Content-Type text/plain;
            add_header X-Robots-Tag "noindex, nofollow" always;
            return 200 "User-agent: *\nDisallow: /\n";
        }

        # Sitemap is not generated for the demo; return 404 for known paths.
        location = /sitemap.xml {
            add_header X-Robots-Tag "noindex, nofollow" always;
            return 404;
        }

        # Health check for uptime monitoring (6.10).
        location = /health {
            default_type application/json;
            add_header X-Robots-Tag "noindex, nofollow" always;
            return 200 '{"status":"ok"}';
        }

        # Read-only live BCSE snapshot. The API is on the internal Docker
        # network; other API families remain fail-closed below.
        location = /api/v1/demo/market-data {
            proxy_pass http://api:8000/api/v1/demo/market-data;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
        }

        # The demo must not masquerade as the full product. These routes have
        # no upstream in this image and deliberately fail closed instead of
        # falling back to the SPA shell.
        location ~ ^/(api|auth|billing|admin|webhook)(/|$) {
            add_header X-Robots-Tag "noindex, nofollow" always;
            return 404;
        }

        # Static assets with caching
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
