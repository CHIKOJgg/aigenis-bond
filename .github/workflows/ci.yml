name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check (whole project)
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Size budget check
        run: python scripts/check_size_budget.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project
        run: pip install -e ".[dev]" || pip install -e .
      - name: Install test deps
        run: pip install pytest
      - name: Run tests
        run: pytest

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project + mypy
        run: |
          pip install -e . || true
          pip install mypy
      - name: Mypy (strict for core packages)
        run: mypy --follow-imports=silent api/aigenis scoring portfolio

  migrations:
    # Verify the Alembic chain applies cleanly on a fresh Postgres from zero to
    # head (and that a downgrade path exists). Catches broken/merge migrations.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aigenis
          POSTGRES_PASSWORD: aigenis
          POSTGRES_DB: aigenis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aigenis"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://aigenis:aigenis@localhost:5432/aigenis
      DATABASE_URL_SYNC: postgresql://aigenis:aigenis@localhost:5432/aigenis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project
        run: pip install -e .
      - name: Alembic upgrade head
        run: alembic upgrade head
      - name: Alembic downgrade to base
        run: alembic downgrade base

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests (Vitest)
        run: npm run test
      - name: Build
        run: npm run build

  frontend-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: E2E smoke test
        run: npm run test:e2e
      # Visual regression (npm run test:e2e:visual) runs locally against the
      # committed win32 baselines — platform-specific fonts make it unstable
      # on Linux runners.
