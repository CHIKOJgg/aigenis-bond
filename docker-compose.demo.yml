# =============================================================================
# Demo deployment — standalone live read-only frontend
# =============================================================================
# Запускает демо-интерфейс с live read-only proxy к API в общей Docker-сети.
# API использует актуальные данные из PostgreSQL. Платежи, авторизация,
# Telegram и любые write-endpoints недоступны. По умолчанию:
# http://localhost:8080 (можно переопределить через DEMO_PORT).
#
# Использование:
#   docker compose -f docker-compose.demo.yml up -d --build
#
# Безопасность (6.8/6.9):
#   - X-Robots-Tag: noindex, nofollow на всех ответах
#   - robots.txt -> Disallow: /
#   - проксируются только /api/v1/demo/* (market-data, search, bond detail)
#   - /api, /billing, /admin и /webhook вне demo-family закрыты
# =============================================================================

services:
  demo:
    build:
      context: ./frontend
      dockerfile: Dockerfile.demo
    image: aigenis-frontend-demo:latest
    container_name: aigenis-demo
    restart: unless-stopped
    ports:
      - "${DEMO_PORT:-8080}:80"
    healthcheck:
      # Alpine wget resolves localhost to ::1 first; nginx listens on IPv4 in
      # the demo image, so use the explicit loopback address for a real check.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - aigenis-net

networks:
  aigenis-net:
    external: true
    name: aigenis-net
